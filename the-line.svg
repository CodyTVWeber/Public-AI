<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="line-title line-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="line-title">The line from idea to production</title>
  <desc id="line-desc">You start with an idea, align, and plan. The agent runs implement, review, verify, and watch. You merge to production and monitor the deploy. A failing check stops the line so production never sees it.</desc>
  <defs>
    <marker id="line-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker>
    <marker id="line-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <rect x="10" y="10" width="190" height="250" rx="14" fill="#f1f5f9"/>
  <text x="105" y="34" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">YOU START</text>
  <rect x="215" y="10" width="470" height="250" rx="14" fill="#ecfeff" stroke="#0e7490" stroke-dasharray="5 4"/>
  <text x="450" y="34" text-anchor="middle" font-size="12" font-weight="800" fill="#0e7490">AGENT RUNS · scripts pass or fail</text>
  <rect x="700" y="10" width="290" height="250" rx="14" fill="#fef2f2" stroke="#0f172a" stroke-width="2"/>
  <text x="845" y="34" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">YOU SHIP · production</text>
  <g font-size="11.5">
    <rect x="25" y="48" width="160" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="105" y="69" text-anchor="middle" font-weight="700">Idea</text>
    <text x="105" y="86" text-anchor="middle" fill="#64748b" font-size="10.5">what you want</text>
    <rect x="25" y="110" width="160" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="105" y="131" text-anchor="middle" font-weight="700">Align</text>
    <text x="105" y="148" text-anchor="middle" fill="#64748b" font-size="10.5">agree the picture</text>
    <rect x="25" y="172" width="160" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="105" y="193" text-anchor="middle" font-weight="700">Plan</text>
    <text x="105" y="210" text-anchor="middle" fill="#64748b" font-size="10.5">write it down · PR</text>
    <line x1="105" y1="98" x2="105" y2="108" stroke="#0f172a" stroke-width="1.6" marker-end="url(#line-a)"/>
    <line x1="105" y1="160" x2="105" y2="170" stroke="#0f172a" stroke-width="1.6" marker-end="url(#line-a)"/>
    <text x="105" y="238" text-anchor="middle" fill="#64748b" font-size="10.5">agree before building</text>
    <rect x="230" y="55" width="140" height="78" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/>
    <text x="300" y="78" text-anchor="middle" font-weight="800" fill="#0e7490">Implement</text>
    <text x="300" y="95" text-anchor="middle" font-size="10.5">spawn workers</text>
    <text x="300" y="110" text-anchor="middle" font-size="10.5">make it work</text>
    <text x="300" y="125" text-anchor="middle" font-size="10.5">open the PR</text>
    <rect x="385" y="55" width="140" height="78" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/>
    <text x="455" y="78" text-anchor="middle" font-weight="800" fill="#0e7490">Review</text>
    <text x="455" y="95" text-anchor="middle" font-size="10.5">read-only</text>
    <text x="455" y="110" text-anchor="middle" font-size="10.5">against the plan</text>
    <text x="455" y="125" text-anchor="middle" font-size="10.5">findings go back</text>
    <rect x="540" y="55" width="132" height="78" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/>
    <text x="606" y="78" text-anchor="middle" font-weight="800" fill="#0e7490">Verify</text>
    <text x="606" y="95" text-anchor="middle" font-size="10.5">proof on the PR</text>
    <text x="606" y="110" text-anchor="middle" font-size="10.5">what a person sees</text>
    <text x="606" y="125" text-anchor="middle" font-size="10.5">tests · evidence</text>
    <line x1="185" y1="197" x2="228" y2="100" stroke="#0f172a" stroke-width="1.6" marker-end="url(#line-a)"/>
    <line x1="370" y1="94" x2="383" y2="94" stroke="#0f172a" stroke-width="1.6" marker-end="url(#line-a)"/>
    <line x1="525" y1="94" x2="538" y2="94" stroke="#0f172a" stroke-width="1.6" marker-end="url(#line-a)"/>
    <rect x="345" y="160" width="327" height="80" rx="10" fill="#0f766e"/>
    <text x="508" y="184" text-anchor="middle" fill="#fff" font-weight="800">Watch · pipeline goes green</text>
    <text x="508" y="204" text-anchor="middle" fill="#ccfbf1" font-size="10.5">CI · review threads quiet</text>
    <text x="508" y="222" text-anchor="middle" fill="#ccfbf1" font-size="10.5">agent never merges</text>
    <line x1="606" y1="133" x2="606" y2="157" stroke="#0f172a" stroke-width="1.6" marker-end="url(#line-a)"/>
    <text x="232" y="196" fill="#dc2626" font-size="11" font-weight="700">✕ any check fails</text>
    <text x="232" y="212" fill="#dc2626" font-size="11" font-weight="700">→ station stops,</text>
    <text x="232" y="228" fill="#dc2626" font-size="11" font-weight="700">you never merge it</text>
    <rect x="715" y="55" width="260" height="46" rx="10" fill="#fff" stroke="#0f172a"/>
    <text x="845" y="74" text-anchor="middle" font-weight="800">You merge</text>
    <text x="845" y="90" text-anchor="middle" font-size="10.5">starting it = the approval</text>
    <rect x="715" y="112" width="260" height="130" rx="10" fill="#fff" stroke="#0f172a"/>
    <text x="730" y="133" font-weight="800" font-size="12">Production · live system</text>
    <g font-size="11">
      <text x="730" y="153">1 merge lands · it is live</text>
      <text x="730" y="170">2 Monitor the deploy</text>
      <text x="730" y="187">3 read-only window</text>
      <text x="730" y="204" fill="#dc2626" font-weight="700">4 fail → report, never act</text>
      <text x="730" y="221">5 you pick the next move</text>
    </g>
    <path d="M672 200 C 700 200, 690 78, 712 78" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#line-a)"/>
    <text x="845" y="256" text-anchor="middle" font-size="10" fill="#64748b">◀ you merge · agent never merges</text>
    <g font-size="11" font-weight="800">
      <polygon points="10,285 135,285 155,310 135,335 10,335" fill="#0f766e"/>
      <text x="72" y="315" text-anchor="middle" fill="#fff">Align</text>
      <polygon points="150,285 275,285 295,310 275,335 150,335 170,310" fill="#0e7490"/>
      <text x="212" y="315" text-anchor="middle" fill="#fff">Plan</text>
      <polygon points="290,285 415,285 435,310 415,335 290,335 310,310" fill="#0369a1"/>
      <text x="352" y="315" text-anchor="middle" fill="#fff">Implement</text>
      <polygon points="430,285 555,285 575,310 555,335 430,335 450,310" fill="#1d4ed8"/>
      <text x="492" y="315" text-anchor="middle" fill="#fff">Review</text>
      <polygon points="570,285 695,285 715,310 695,335 570,335 590,310" fill="#4338ca"/>
      <text x="632" y="315" text-anchor="middle" fill="#fff">Verify</text>
      <polygon points="710,285 835,285 855,310 835,335 710,335 730,310" fill="#6d28d9"/>
      <text x="772" y="315" text-anchor="middle" fill="#fff">Watch</text>
      <polygon points="850,285 990,285 990,335 850,335 870,310" fill="#a21caf"/>
      <text x="920" y="315" text-anchor="middle" fill="#fff">Monitor</text>
    </g>
    <g font-size="10.5" fill="#475569">
      <text x="72" y="352" text-anchor="middle">/align</text>
      <text x="212" y="352" text-anchor="middle">/plan</text>
      <text x="352" y="352" text-anchor="middle">/implement</text>
      <text x="492" y="352" text-anchor="middle">/review</text>
      <text x="632" y="352" text-anchor="middle">/verify</text>
      <text x="772" y="352" text-anchor="middle">/watch</text>
      <text x="920" y="352" text-anchor="middle">/monitor</text>
    </g>
    <text x="500" y="385" text-anchor="middle" font-size="11.5" fill="#0f172a"><tspan font-weight="800">A script passes or fails.</tspan> The agent judges only what a script cannot.</text>
  </g>
</svg>

name: public-ai-sync-bump
on:
  push:
    branches:
      - main
    paths:
      - "rules/**"
      - "skills/**"
      - "AI-setup/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".claude/**"
      - ".func-size"
      - ".mr-size"
      - "packages/public-ai-sync/**"
      - "!packages/public-ai-sync/package.json"
jobs:
  bump:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump public-ai-sync version
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node packages/public-ai-sync/scripts/bump.mjs

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{TITLE}} — Before/After Visualization</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --pending: #3a4050;
    --success: #2fbf71;
    --fail: #e5484d;
    --revert: #f5a623;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
  .controls { margin-bottom: 28px; display: flex; gap: 12px; align-items: center; }
  button {
    background: #2f6fed;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #4680f5; }
  button:disabled { background: #3a4050; cursor: not-allowed; }
  .speed-label { color: var(--muted); font-size: 13px; }
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .badge.before { background: rgba(229,72,77,0.15); color: var(--fail); }
  .badge.after { background: rgba(47,191,113,0.15); color: var(--success); }
  .panel .desc { color: var(--muted); font-size: 12.5px; margin: 4px 0 16px; line-height: 1.5; }
  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 6px;
    background: #1d212b;
    border: 1px solid var(--border);
    font-size: 13px;
    transition: background 0.35s ease, border-color 0.35s ease, transform 0.25s ease;
  }
  .item .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--pending);
    flex-shrink: 0;
    transition: background 0.35s ease, box-shadow 0.35s ease;
  }
  .item .name { flex: 1; }
  .item .status {
    font-size: 11px;
    color: var(--muted);
    font-family: 'SF Mono', Menlo, monospace;
    min-width: 84px;
    text-align: right;
  }
  .item.pending .dot { background: var(--pending); }
  .item.success .dot { background: var(--success); box-shadow: 0 0 8px rgba(47,191,113,0.6); }
  .item.success .status { color: var(--success); }
  .item.fail .dot { background: var(--fail); box-shadow: 0 0 8px rgba(229,72,77,0.6); }
  .item.fail .status { color: var(--fail); }
  .item.reverted { background: rgba(245,166,35,0.08); border-color: rgba(245,166,35,0.4); transform: translateX(2px); }
  .item.reverted .status { color: var(--revert); }
  .log {
    margin-top: 18px;
    background: #0c0e12;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--muted);
    min-height: 150px;
    max-height: 220px;
    overflow-y: auto;
  }
  .log .line { white-space: pre-wrap; }
  .log .line.err { color: var(--fail); }
  .log .line.warn { color: var(--revert); }
  .log .line.ok { color: var(--success); }
  .summary {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    display: none;
  }
  .summary.show { display: block; }
  .summary.bad { background: rgba(229,72,77,0.12); color: var(--fail); border: 1px solid rgba(229,72,77,0.35); }
  .summary.good { background: rgba(47,191,113,0.12); color: var(--success); border: 1px solid rgba(47,191,113,0.35); }
  .code {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .code h2 { font-size: 14px; margin: 0 0 10px; }
  .code-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  pre {
    background: #0c0e12;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 12px;
    line-height: 1.6;
    overflow-x: auto;
    margin: 0;
  }
  .code-cols .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
  .tok-kw { color: #c586c0; }
  .tok-str { color: #ce9178; }
  .tok-fn { color: #dcdcaa; }
  .tok-com { color: #6a9955; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<h1>{{TITLE}}</h1>
<div class="subtitle">
  {{SUBTITLE}}
  <!-- MUST state, if the numbers are a dramatized/simplified case rather than a
       verified real constant: say so explicitly here. Never silently round up
       counts (e.g. "10-15 tasks") without checking the actual limit in code. -->
</div>

<div class="controls">
  <button id="playBtn" onclick="runAnimation()">▶ Run simulation</button>
  <button id="resetBtn" onclick="resetAll()" disabled>↺ Reset</button>
  <span class="speed-label">{{SCENARIO_CAPTION}}</span>
</div>

<div class="panels">
  <div class="panel">
    <h2>Before fix <span class="badge before">BUG</span></h2>
    <div class="desc">{{BEFORE_DESC}}</div>
    <div class="item-list" id="before-list"></div>
    <div class="log" id="before-log"></div>
    <div class="summary" id="before-summary"></div>
  </div>

  <div class="panel">
    <h2>After fix <span class="badge after">FIXED</span></h2>
    <div class="desc">{{AFTER_DESC}}</div>
    <div class="item-list" id="after-list"></div>
    <div class="log" id="after-log"></div>
    <div class="summary" id="after-summary"></div>
  </div>
</div>

<div class="code">
  <h2>The actual diff (<code>{{FILE_PATH}}</code>)</h2>
  <div class="code-cols">
    <div>
      <div class="label">Before</div>
      <pre>{{CODE_BEFORE}}</pre>
    </div>
    <div>
      <div class="label">After</div>
      <pre>{{CODE_AFTER}}</pre>
    </div>
  </div>
</div>

<footer>{{FOOTER}}</footer>

<script>
// ---------------------------------------------------------------------------
// Fill in ITEMS and FAIL_INDEX, then write the narrative in runAnimation().
// CRITICAL: prefix + '-task-' + item.id must be IDENTICAL in buildList(),
// setStatus(), and markReverted() — a mismatch here throws on the first
// status update and silently kills the whole animation with buttons stuck
// disabled and no visible error. This is the #1 recurring bug in this
// template. Always pass an explicit `prefix` into buildList, never derive
// it from the container id (e.g. 'before-list' != 'before').
// ---------------------------------------------------------------------------
const ITEMS = [
  { id: 1, name: 'Item 1' },
  { id: 2, name: 'Item 2' },
  { id: 3, name: 'Item 3' },
];
const FAIL_INDEX = 1; // zero-based index into ITEMS that fails

function buildList(containerId, prefix) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  ITEMS.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item pending';
    row.id = prefix + '-item-' + item.id;
    row.innerHTML = `<div class="dot"></div><div class="name">${item.name}</div><div class="status">queued</div>`;
    el.appendChild(row);
  });
}
buildList('before-list', 'before');
buildList('after-list', 'after');

function log(containerId, text, cls) {
  const el = document.getElementById(containerId);
  const line = document.createElement('div');
  line.className = 'line' + (cls ? ' ' + cls : '');
  line.textContent = text;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setStatus(prefix, idx, statusClass, statusText) {
  const row = document.getElementById(prefix + '-item-' + ITEMS[idx].id);
  row.className = 'item ' + statusClass;
  row.querySelector('.status').textContent = statusText;
}

function markReverted(prefix, idx) {
  const row = document.getElementById(prefix + '-item-' + ITEMS[idx].id);
  row.classList.add('reverted');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runAnimation() {
  document.getElementById('playBtn').disabled = true;
  document.getElementById('resetBtn').disabled = true;
  document.getElementById('before-log').innerHTML = '';
  document.getElementById('after-log').innerHTML = '';
  document.getElementById('before-summary').className = 'summary';
  document.getElementById('after-summary').className = 'summary';

  // TODO: write the step-by-step narrative here, mirroring the real
  // execution order described in the plan/investigation. Use log(),
  // setStatus(), markReverted() with await sleep(...) between steps.
  // End with summary text in both '#before-summary' and '#after-summary'
  // and re-enable the reset button.

  document.getElementById('resetBtn').disabled = false;
}

function resetAll() {
  buildList('before-list', 'before');
  buildList('after-list', 'after');
  document.getElementById('before-log').innerHTML = '';
  document.getElementById('after-log').innerHTML = '';
  document.getElementById('before-summary').className = 'summary';
  document.getElementById('after-summary').className = 'summary';
  document.getElementById('playBtn').disabled = false;
  document.getElementById('resetBtn').disabled = true;
}
</script>

</body>
</html>

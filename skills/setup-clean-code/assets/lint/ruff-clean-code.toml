# Merge into pyproject.toml ([tool.ruff] / [tool.ruff.lint]) for Python.
# Mechanical half of the clean-code rule: nesting, params, complexity, branches, magic numbers.
[tool.ruff.lint]
extend-select = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901", "SIM", "E722", "S110"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 40
max-branches = 8
max-returns = 6

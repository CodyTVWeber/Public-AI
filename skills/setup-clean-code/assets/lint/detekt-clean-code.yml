# Merge into the project's detekt config (config/detekt/detekt.yml) for Kotlin.
# Mechanical half of the clean-code rule: nesting, params, function and class size, empty catch.
complexity:
  NestedBlockDepth:
    active: true
    threshold: 4
  LongMethod:
    active: true
    threshold: 40
  LongParameterList:
    active: true
    functionThreshold: 4
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  LargeClass:
    active: true
    threshold: 200
  CyclomaticComplexMethod:
    active: true
    threshold: 10
exceptions:
  EmptyCatchBlock:
    active: true
  SwallowedException:
    active: true
style:
  MagicNumber:
    active: true
    ignoreNumbers: ["-1", "0", "1", "2"]
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
